  const SCHEMA = [["ch", 1], ["lv", 1], ["cit", 1], ["age", 1], ["fld", 1], ["pri", 1], ["c0", 1], ["c1", 1], ["c2", 1], ["p0", 2], ["p1", 2], ["p2", 2],

    ["conf0", 1], ["conf1", 1], ["useful", 1], ["score", 2], ["info", 1], ["min", 2]];
  const LEN = SCHEMA.reduce((a, f) => a + f[1], 0) + 1;
  const enc = (n, w) => { const max = Math.pow(36, w) - 1; n = Math.max(0, Math.min(max, Math.round(Number(n) || 0))); let s = ""; for (let i = 0; i < w; i++) { s = B[n % 36] + s; n = Math.floor(n / 36); } return s; };
  const dec = (s) => s.split("").reduce((a, ch) => a * 36 + B.indexOf(ch), 0);
  function encode(o) {
    const body = SCHEMA.map(([k, w]) => enc(o[k], w)).join("");
    const sum = body.split("").reduce((a, ch) => a + B.indexOf(ch), 0) % 36;
    return PREFIX + "-" + (body + B[sum]).match(/.{1,4}/g).join("-");
  }
  function decode(code) {
    const s = String(code || "").toUpperCase().replace(new RegExp("^\\s*" + PREFIX + "-?"), "").replace(/[^0-9A-Z]/g, "");
    if (s.length !== LEN) return { error: "В коде должно быть " + LEN + " знаков после " + PREFIX + ", а здесь " + s.length + "." };

  return { encode, decode, RE, LEN, CHANNELS, LEVELS, CITS, AGES, PRIOS, COMP_NAMES };
})();

    const xref = len;
    let xr = "xref\n0 6\n0000000000 65535 f \n"; for (let i = 1; i <= 5; i++) xr += String(offs[i]).padStart(10, "0") + " 00000 n \n";
    push(xr + "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
    const out = new Uint8Array(len); let p = 0; chunks.forEach((c) => { out.set(c, p); p += c.length; }); return out;
  }
  let dlPromise = null;
  function downloads() { if (!dlPromise) dlPromise = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null); return dlPromise; }
  async function savePdf() {
    const toast = document.getElementById("toast");
    if (toast) toast.textContent = "Готовим PDF…";
    const cv = await drawPassport();
    const url = cv.toDataURL("image/jpeg", 0.9), bin = atob(url.split(",")[1]), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const pdf = pdfFromJpeg(bytes, cv.width, cv.height);
    window.__lastPdf = pdf;
    const dl = await downloads();
    if (dl) {
      try { await dl.save({ filename: "Штурман — паспорт маршрута.pdf", data: new Blob([pdf], { type: "application/pdf" }) }); if (toast) toast.textContent = "PDF сохранён."; return; }
      catch (e) { if (e && (e.code === "declined" || e.code === "rate_limited")) { if (toast) toast.textContent = e.code === "declined" ? "Сохранение отменено." : "Подождите пару секунд и попробуйте снова."; return; } }
    }
    if (!window.claude) {
      try {
        const u = URL.createObjectURL(new Blob([pdf], { type: "application/pdf" })), a = document.createElement("a");
        a.href = u; a.download = "Штурман — паспорт маршрута.pdf"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 8000);
        if (toast) toast.textContent = "Готово, проверьте загрузки. Файла нет? Нажмите ещё раз или скопируйте текст Паспорта.";
        return;
      } catch (e) { /* ниже запасной вариант — картинка */ }
    }
    if (toast) toast.textContent = "";
    openSheet("Сохраните Паспорт картинкой", `<p class="small">Здесь браузер не даёт скачать файл. Нажмите на картинку и удерживайте (на компьютере — правая кнопка мыши) и выберите «Сохранить изображение».</p><img class="pimg" src="${url}" alt="Паспорт маршрута">`);
  }

  /* ---------- шторка: пояснения и карточки городов ---------- */
  const sheetRoot = document.getElementById("sheet-root");
  let sheetReturn = null;
  function openSheet(title, html) {
    sheetReturn = document.activeElement;
    sheetRoot.innerHTML = `<div class="scrim" data-a="sheetclose"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-hd"><h2 id="sh-t">${esc(title)}</h2><button class="x" data-a="sheetclose" aria-label="Закрыть">✕</button></div><div class="sheet-bd">${html}</div></div>`;
    sheetRoot.hidden = false;
    const xb = sheetRoot.querySelector(".x"); if (xb) xb.focus();
  }
  function closeSheet() { sheetRoot.hidden = true; sheetRoot.innerHTML = ""; if (sheetReturn && sheetReturn.focus) sheetReturn.focus(); }
  sheetRoot.addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); if (el && el.dataset.a === "sheetclose") closeSheet(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !sheetRoot.hidden) closeSheet();
    if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("role") === "button" && e.target.dataset && e.target.dataset.a && e.target.tagName.toLowerCase() !== "button") { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
  });
  function cityInfo(i) {
    const c = C[i], moneyDone = S.revealed.every(Boolean) || (SCREEN_ST[S.screen] || 0) >= 3;
    seen = new Set();
    return `<div class="city">${plate(c, true)}<div class="grow"><div class="nm">${esc(c.name)}</div><div class="rg">${esc(c.region)} · ${esc(c.size.toLowerCase())}</div></div></div>
      <div class="list">
        <div class="li"><span class="k muted">Вузы</span><span class="r">${esc(c.unis)}</span></div>
        <div class="li"><span class="k muted">Сильные направления</span><span class="r">${esc(c.strong)}</span></div>
        <div class="li"><span class="k muted">Программы на английском</span><span class="r"><span aria-hidden="true">${"●".repeat(c.eng)}${"○".repeat(5 - c.eng)}</span><span class="sr">${c.eng} из 5</span></span></div>
        ${moneyDone ? `<div class="li"><span class="k muted">Комната</span><span class="r">${eur(c.rent)} в месяц</span></div><div class="li"><span class="k muted">Баланс</span><span class="r num">${eur(bal(c), true)}</span></div>` : `<div class="li"><span class="k muted">Деньги</span><span class="r">посчитаем на заправке</span></div>`}
      </div>
      ${moneyDone ? dsuBadge(c) : ""}
      <p class="small muted">${gl(c.note)}</p><p class="src">Оценка английских программ — мнение эксперта.</p>`;
  }

  /* ---------- отрисовка ---------- */
  const root = document.getElementById("app");
  const chip = document.getElementById("chip");
  let lastScore = 0, chipT = null;
  function render(moveFocus) {
    seen = new Set();
    const fn = T[S.screen] || T.intro;
    const body = fn();
    root.innerHTML = header() + body;
    save(); TR.screen(); TR.end();
    if (moveFocus) { window.scrollTo(0, 0); const h = root.querySelector("h1[tabindex]"); if (h) h.focus({ preventScroll: true }); }
    const sl = document.getElementById("sl"); if (sl) sl.addEventListener("input", onSlide);
    const cm = document.getElementById("cm"); if (cm) cm.addEventListener("input", () => { S.comment = cm.value.slice(0, 300); save(); refreshLinks(); TR.end(); });
    const nmI = document.getElementById("nm"), nkI = document.getElementById("nk");
    if (nmI) nmI.addEventListener("input", () => { S.name = nmI.value.slice(0, 40); save(); const b = root.querySelector('[data-a="hello_next"]'); if (b) b.disabled = !nm(); });
    if (nkI) nkI.addEventListener("input", () => { S.nick = nkI.value.slice(0, 40); save(); });
    const t = total();
    if (t > lastScore && SCREEN_ST[S.screen]) flashScore(t - lastScore);
    lastScore = t;
  }
  function refreshLinks() { const a = document.getElementById("l-tg"), b = document.getElementById("l-wa"); if (a) a.href = tgHref(); if (b) b.href = waHref(); }
  function flashScore(d) { chip.textContent = "+" + d + " " + plural(d, "очко", "очка", "очков") + " штурмана"; chip.hidden = false; clearTimeout(chipT); chipT = setTimeout(() => { chip.hidden = true; }, 1800); }
  function onSlide(e) {
    const k = ["money0", "money1", "money2"].indexOf(S.screen); if (k < 0) return;
    const v = Number(e.target.value); S.preds[k] = v;
    e.target.setAttribute("aria-valuetext", eur(v, true));
    const pv = document.getElementById("pv"); if (pv) pv.textContent = eur(v, true);
    const b = root.querySelector('[data-a="reveal"]'); if (b) b.disabled = false;
    save();
  }
  function resetRoute() { S.cities0 = suggest(); S.cities = S.cities0.slice(); S.preds = [null, null, null]; S.revealed = [false, false, false]; S.comps = []; S.main = null; S.compare = null; S.condScored = false; }
  function copyText(text, okMsg, quiet) {
    const toast = document.getElementById("toast");
    const fail = () => { if (quiet) return; openSheet("Скопируйте текст", `<textarea class="copybox" readonly>${esc(text)}</textarea><p class="small muted">Выделите текст и скопируйте его.</p>`); const ta = sheetRoot.querySelector("textarea"); if (ta) { ta.focus(); ta.select(); } };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { if (toast && okMsg) toast.textContent = okMsg; }, fail); else fail(); } catch (e) { fail(); }
  }

  root.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
    const a = el.dataset.a, v = el.dataset.v, k = el.dataset.k;
    if (a === "back") return back();
    if (a === "go") return go(v);
    if (a === "info") { e.preventDefault(); e.stopPropagation(); if (!S.infoSeen.includes(v)) { S.infoSeen.push(v); S.infoOpens++; save(); } openSheet(v, `<p>${esc(D.glossary[v] || "")}</p>`); return; }
    if (a === "cityinfo") { const i = Number(v); openSheet(C[i].name, cityInfo(i)); return; }
    if (a === "start") { const ch = S.channel, sid = S.sid; clearSaved(); S = fresh(); S.channel = ch; S.sid = sid; lastScore = 0; return go("hello"); }
    if (a === "resume") { const o = load(); if (o) { const ch = S.channel; S = o; if (!S.sid) S.sid = rid(); if (ch !== "direct") S.channel = ch; } lastScore = total(); TR.mark("resume"); return render(true); }
    if (a === "restart") { const ch = S.channel, n0 = S.name, k0 = S.nick; clearSaved(); S = fresh(); S.channel = ch; S.name = n0; S.nick = k0; lastScore = 0; TR.mark("again"); return go("q_level"); }
    if (a === "hello_next") { if (!nm()) return; return go("q_level"); }
    if (a === "scale") {
      S[k] = Number(v); save();
      root.querySelectorAll(`[data-a="scale"][data-k="${k}"]`).forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === v ? "true" : "false"));
      refreshLinks(); TR.end(); return;
    }
    if (a === "pick") { const [key, raw] = v.split(":"); S[key] = ["age", "prio"].includes(key) ? Number(raw) : raw; save(); return render(false); }
    if (a === "qnext") { const i = QS.indexOf(S.screen); if (i === 4) resetRoute(); save(); return go(i < 4 ? QS[i + 1] : "scout"); }
    if (a === "swap") { S.swapping = S.swapping === Number(v) ? null : Number(v); return render(false); }
    if (a === "swapto") { const i = Number(v), kk = Number(k); S.cities0[kk] = i; S.cities = S.cities0.slice(); S.preds[kk] = null; S.revealed[kk] = false; S.comps = []; S.main = null; S.swapping = null; save(); return render(false); }
    if (a === "reveal") { S.revealed[Number(v)] = true; save(); return render(false); }
    if (a === "skippred") { const kk = Number(v); S.preds[kk] = null; S.revealed[kk] = true; save(); return render(false); }
    if (a === "toggle") { if (S.picks.includes(v)) S.picks = S.picks.filter((x) => x !== v); else if (S.picks.length < 3) S.picks.push(v); save(); return render(false); }
    if (a === "to_docs") { S.picksAtSubmit = S.picks.length; S.closedAtSubmit = S.picks.filter((id) => elig(SCH.find((s) => s.id === id)).st === "closed").length; S.comps = []; S.condScored = false; save(); return go("docs"); }
    if (a === "to_comp") { S.condScored = true; return go("comp0"); }
    if (a === "doc") { if (S.docs.includes(v)) S.docs = S.docs.filter((x) => x !== v); else S.docs.push(v); save(); return render(false); }
    if (a === "choose_opt") { applyChoice(Number(k), Number(v)); save(); return render(false); }
    if (a === "main") { S.main = Number(v); save(); return render(false); }
    if (a === "compare") { S.compare = Number(v); save(); return render(false); }
    if (a === "to_finish") { if (S.main == null) S.main = mainCity(); S.finished = true; return go("passport"); }
    if (a === "copy") { TR.via("copy"); copyText(passportText(), "Текст Паспорта скопирован."); return; }
    if (a === "sendtg") { TR.via("tg"); copyText(messageText(), "Открываем чат с Андреем. Текст уже в буфере обмена — если он не подставился, вставьте его.", true); return; }
    if (a === "sendwa") { TR.via("wa"); copyText(passportText(), "Открываем WhatsApp. Текст уже в буфере обмена.", true); return; }
    if (a === "pdf") { TR.via("pdf"); savePdf(); return; }
    if (a === "friend") { TR.via("friend_" + v); return; }
  });

  /* ---------- старт ---------- */
  let qUtm = ""; try { qUtm = new URLSearchParams(location.search).get("utm_source") || ""; } catch (e) { }
  const chStart = chClean(CFG.ch != null ? CFG.ch : location.hash) || chClean(CFG.utm) || chClean(qUtm);
  if (chStart) S.channel = chStart;
  render(false);
  TR.open();
  downloads();
  window.__shturman = { get state() { return S; }, sessionCode, passportText, messageText, elig, suggest, total, parts, drawPassport, pdfFromJpeg, savePdf, badges };
})();

</script>
